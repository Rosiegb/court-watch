
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Court Watch</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f6f6f4;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

main {
  max-width: 600px;
  margin: 0 auto;
  padding: max(24px, env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
}

header { padding: 24px 0 20px; }
h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -1px; }

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}

.watch { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.watch-info { min-width: 0; }
.watch-date { font-weight: 700; font-size: 17px; margin-bottom: 5px; }
.watch-details { color: #666; font-size: 14px; }
.status { font-size: 13px; margin-top: 7px; }
.active { color: #16803c; }
.paused { color: #999; }

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  background: #111;
  color: white;
  cursor: pointer;
}

button.secondary { background: #eee; color: #111; }
button.delete { background: #f1f1f1; color: #c33; padding: 9px 12px; font-size: 13px; }
button:active { transform: scale(.98); }
.add { width: 100%; font-size: 16px; padding: 16px; }

.form { display: none; }
.form.show { display: block; }

label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 7px; }

input, select {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  background: white;
  margin-bottom: 16px;
}

.form-actions { display: flex; gap: 10px; }
.form-actions button { flex: 1; }
.empty { text-align: center; color: #777; padding: 20px 5px; }
.settings { margin-top: 24px; }
.small { color: #888; font-size: 12px; line-height: 1.5; }
.token-box { display: none; }
.token-box.show { display: block; }

.message {
  display: none;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 14px;
}
.message.show { display: block; }
.success { background: #e9f7ee; color: #176b38; }
.error { background: #fff0f0; color: #a33; }
</style>
</head>

<body>
<main>
<header>
<h1>Court Watch 🎾</h1>
</header>

<div id="message" class="message"></div>
<div id="watchList"></div>

<button class="add" onclick="showForm()">＋ Add alert</button>

<div id="form" class="card form">
<h2>Add alert</h2>

<label>Dates</label>
<input id="date" type="date">

<button type="button" class="secondary" onclick="addSelectedDate()" style="width:100%; margin:-6px 0 12px">
＋ Add this date
</button>

<div id="selectedDates" class="watch-details" style="margin-bottom:16px">
No dates selected yet.
</div>

<label>From</label>
<input id="from" type="time" value="08:00">

<label>Until</label>
<input id="until" type="time" value="22:00">

<label>Duration</label>
<select id="duration">
<option value="40">40 minutes</option>
<option value="60" selected>60 minutes</option>
</select>

<div class="form-actions">
<button class="secondary" onclick="hideForm()">Cancel</button>
<button onclick="addWatch()">Save</button>
</div>
</div>

<div class="settings">
<div class="card">
<button class="secondary" style="width:100%" onclick="showToken()">GitHub connection</button>

<div id="tokenBox" class="token-box">
<br>
<label>GitHub token</label>
<input id="token" type="password" placeholder="Paste your GitHub token">

<button onclick="saveToken()" style="width:100%">Save connection</button>
<br><br>

<div class="small">
Your token stays on this iPhone/browser and is not written into the Court Watch repository.
Use a fine-grained GitHub token with Actions → Read and write for this repository.
</div>
</div>
</div>
</div>
</main>

<script>
const OWNER = "Rosiegb";
const REPO = "court-watch";
const WORKFLOW = "check.yml";
const BRANCH = "main";

const ALERTS_URL =
  "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/main/alerts.json";

let watches = [];
let watchesLoaded = false;
let syncing = false;
let selectedDates = [];
let pendingPayload = null;

function getToken() {
  return localStorage.getItem("courtWatchGithubToken");
}

function showMessage(text, type = "success") {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message show " + type;
  setTimeout(() => { box.className = "message"; }, 5000);
}

async function loadWatches() {
  try {
    // Use the GitHub Pages copy on the same origin to avoid Safari CORS failures.
    // A unique query string and reload cache mode prevent stale browser responses.
    const response = await fetch(
      "/court-watch/alerts.json?refresh=" + Date.now(),
      { cache: "reload" }
    );
    if (!response.ok) throw new Error("Court Watch alerts returned HTTP " + response.status);
    const latest = await response.json();
    if (!Array.isArray(latest)) throw new Error("The saved alert list is invalid.");

    const latestPayload = JSON.stringify(latest);
    if (pendingPayload && latestPayload !== pendingPayload) {
      watchesLoaded = true;
      render();
      return;
    }
    if (pendingPayload && latestPayload === pendingPayload) pendingPayload = null;

    watches = latest.slice().sort((a, b) =>
      String(a.date || "").localeCompare(String(b.date || "")) ||
      String(a.from || "").localeCompare(String(b.from || "")) ||
      String(a.until || "").localeCompare(String(b.until || ""))
    );
    watchesLoaded = true;
    render();
  } catch (error) {
    watchesLoaded = false;
    render();
    showMessage("Couldn't load the latest alerts: " + (error.message || "network error") + ". Refresh in a moment; saved alerts have not been changed.", "error");
  }
}

function render() {
  const container = document.getElementById("watchList");
  container.innerHTML = "";

  if (!watchesLoaded) {
    container.innerHTML = '<div class="card empty">Loading saved alerts…</div>';
    return;
  }

  if (!watches.length) {
    container.innerHTML = '<div class="card empty">No watches yet.<br>Add a date and time to start watching.</div>';
    return;
  }

  watches.forEach((watch, index) => {
    const card = document.createElement("div");
    card.className = "card";

    const enabled = watch.enabled !== false;
    const date = new Date(watch.date + "T12:00:00");
    const dateText = date.toLocaleDateString("en-GB", {
      weekday: "short", day: "numeric", month: "short"
    });

    card.innerHTML = `
      <div class="watch">
        <div class="watch-info">
          <div class="watch-date">${dateText}</div>
          <div class="watch-details">
            ${watch.from} – ${watch.until} · ${watch.duration_minutes} min
          </div>
          <div class="status ${enabled ? "active" : "paused"}">
            ${enabled ? "● Watching all courts" : "● Paused"}
          </div>
        </div>
        <button class="secondary" onclick="toggleWatch(${index})">
          ${enabled ? "Pause" : "Resume"}
        </button>
      </div>
      <br>
      <button class="delete" onclick="deleteWatch(${index})">Delete</button>
    `;
    container.appendChild(card);
  });
}

function showForm() {
  if (!watchesLoaded || syncing) {
    showMessage("Please wait until saved alerts have loaded.", "error");
    return;
  }
  document.getElementById("form").classList.add("show");
  renderSelectedDates();
}

function addSelectedDate() {
  const input = document.getElementById("date");
  const date = input.value;

  if (!date) {
    showMessage("Choose a date first.", "error");
    return;
  }

  if (selectedDates.includes(date)) {
    showMessage("That date is already selected.", "error");
    return;
  }

  selectedDates.push(date);
  selectedDates.sort();
  input.value = "";
  renderSelectedDates();
}

function removeSelectedDate(date) {
  selectedDates = selectedDates.filter(value => value !== date);
  renderSelectedDates();
}

function renderSelectedDates() {
  const box = document.getElementById("selectedDates");

  if (!selectedDates.length) {
    box.textContent = "No dates selected yet.";
    return;
  }

  box.innerHTML = "";

  selectedDates.forEach(dateValue => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0";

    const date = new Date(dateValue + "T12:00:00");
    const label = document.createElement("span");
    label.textContent = date.toLocaleDateString("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric"
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "delete";
    remove.textContent = "Remove";
    remove.onclick = () => removeSelectedDate(dateValue);

    row.append(label, remove);
    box.appendChild(row);
  });
}

function hideForm() {
  document.getElementById("form").classList.remove("show");
}

function showToken() {
  document.getElementById("tokenBox").classList.toggle("show");
  const token = getToken();
  if (token) document.getElementById("token").value = token;
}

function saveToken() {
  const token = document.getElementById("token").value.trim();

  if (!token) {
    showMessage("Please paste your GitHub token.", "error");
    return;
  }

  localStorage.setItem("courtWatchGithubToken", token);
  showMessage("GitHub connection saved.");
}

function addWatch() {
  if (!watchesLoaded || syncing) {
    showMessage("Please wait until saved alerts have loaded.", "error");
    return;
  }

  const dateInput = document.getElementById("date");

  if (dateInput.value && !selectedDates.includes(dateInput.value)) {
    selectedDates.push(dateInput.value);
    selectedDates.sort();
    dateInput.value = "";
    renderSelectedDates();
  }

  const from = document.getElementById("from").value;
  const until = document.getElementById("until").value;
  const duration = Number(document.getElementById("duration").value);

  if (!selectedDates.length) {
    showMessage("Add at least one date.", "error");
    return;
  }

  if (!from || !until || from >= until) {
    showMessage("Until time must be after from time.", "error");
    return;
  }

  const previousWatches = JSON.parse(JSON.stringify(watches));
  const datesToAdd = [...selectedDates];

  datesToAdd.forEach(date => {
    const duplicate = watches.some(watch =>
      watch.date === date &&
      watch.from === from &&
      watch.until === until &&
      Number(watch.duration_minutes) === duration
    );

    if (!duplicate) {
      watches.push({
        id: crypto.randomUUID(),
        date,
        from,
        until,
        duration_minutes: duration,
        enabled: true,
        court: "any"
      });
    }
  });

  if (watches.length === previousWatches.length) {
    showMessage("Those alerts already exist.", "error");
    return;
  }

  syncWatches(previousWatches);
}

function toggleWatch(index) {
  if (!watchesLoaded || syncing) return;
  const previousWatches = JSON.parse(JSON.stringify(watches));
  watches[index].enabled = watches[index].enabled === false;
  syncWatches(previousWatches);
}

function deleteWatch(index) {
  if (!watchesLoaded || syncing) return;
  if (!confirm("Delete this alert?")) return;

  const previousWatches = JSON.parse(JSON.stringify(watches));
  watches.splice(index, 1);
  syncWatches(previousWatches);
}

async function syncWatches(previousWatches) {
  const token = getToken();

  if (!token) {
    watches = previousWatches || watches;
    render();
    showToken();
    showMessage("Add your GitHub connection first. No changes have been saved.", "error");
    return;
  }

  if (syncing) return;
  syncing = true;
  render();

  const payload = JSON.stringify(watches);

  try {
    const enableResponse = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/enable`,
      {
        method: "PUT",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28"
        }
      }
    );

    if (!enableResponse.ok) {
      const text = await enableResponse.text();
      throw new Error(`Could not enable Court Watch (${enableResponse.status}): ${text}`);
    }

    const response = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ref: BRANCH,
          inputs: { action: "update", watches: payload }
        })
      }
    );

    if (!response.ok) {
      const text = await response.text();
      throw new Error(`GitHub rejected the request (${response.status}): ${text}`);
    }

    pendingPayload = JSON.stringify(watches);
    selectedDates = [];
    renderSelectedDates();
    hideForm();
    showMessage("🎾 Update accepted by GitHub. Waiting for the alert list to sync…");

    for (let attempt = 0; attempt < 15 && pendingPayload; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 2000));
      await loadWatches();
    }

    if (pendingPayload) {
      showMessage("GitHub accepted the update, but syncing is taking longer than usual. Your changes will stay visible and the app will keep checking.", "error");
    } else {
      showMessage("🎾 Alerts saved and synced.");
    }
  } catch (error) {
    watches = previousWatches || watches;
    render();
    console.error("Court Watch save error:", error);
    showMessage(error.message || "Couldn't save the alert.", "error");
  } finally {
    syncing = false;
    render();
  }
}

loadWatches();

function refreshIfSafe() {
  const formOpen = document.getElementById("form").classList.contains("show");
  if (!syncing && !formOpen) loadWatches();
}

window.addEventListener("focus", refreshIfSafe);
window.addEventListener("pageshow", refreshIfSafe);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshIfSafe();
});
</script>
</body>
</html>
