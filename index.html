<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎾 Court Watch</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #f5f4f0;
      color: #171717;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 48px 22px 32px;
    }

    .ball {
      font-size: 42px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 6px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 34px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      margin-bottom: 18px;
    }

    .venue {
      font-size: 18px;
      font-weight: 600;
    }

    .location {
      color: #888;
      margin-top: 4px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 15px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      margin-top: 20px;
    }

    .note {
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="app">

    <div class="ball">🎾</div>

    <h1>Court Watch</h1>
    <div class="subtitle">Never miss a Highbury court.</div>

    <div class="card">
      <div class="venue">Highbury Tennis</div>
      <div class="location">Islington Tennis Centre</div>

      <a
        class="button"
        href="https://github.com/Rosiegb/court-watch/actions/workflows/check.yml"
      >
        Set up a court watch
      </a>
    </div>

    <div class="note">
      Choose your date, time and duration on the next screen.<br>
      Your iPhone will alert you when a court opens.
    </div>

  </main>
</body>
</html>
