name: Court Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check courts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker.py

      - name: Save notification history
        run: |
          if [ -f seen_slots.json ]; then
            git config user.name "Court Watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_slots.json
            git diff --cached --quiet || git commit -m "Update court alert history"
            git push
          fi
