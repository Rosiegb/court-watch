name: Court Watch

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:

      action:
        description: "Manage Court Watch"
        required: true
        type: choice
        options:
          - update
        default: update

      watches:
        description: "JSON watch configuration"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: court-watch
  cancel-in-progress: false


jobs:

  manage:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update watches
        env:
          WATCHES: ${{ inputs.watches }}
        run: |
          python - <<'PY'
          import json
          import os

          watches = json.loads(
              os.environ["WATCHES"]
          )

          if not isinstance(watches, list):
              raise ValueError(
                  "Watches must be a JSON list."
              )

          with open("alerts.json", "w") as f:
              json.dump(
                  watches,
                  f,
                  indent=2
              )

          print(
              f"Saved {len(watches)} watches."
          )
          PY

      - name: Save watches
        run: |
          git config user.name "Court Watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alerts.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Court Watch alerts"
            git push
          fi


  check:

    if: github.event_name == 'schedule'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check courts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python checker.py

      - name: Save state
        run: |
          git config user.name "Court Watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add slot_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Court Watch state"
            git push
          fi
