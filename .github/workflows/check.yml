name: Court Watch

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to watch (YYYY-MM-DD)"
        required: true
        default: "2026-09-25"

      from:
        description: "Earliest time (HH:MM)"
        required: true
        default: "08:00"

      until:
        description: "Latest time (HH:MM)"
        required: true
        default: "22:00"

      duration:
        description: "Duration in minutes"
        required: true
        type: choice
        options:
          - "40"
          - "60"
        default: "60"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Update watch settings
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat > alerts.json <<'EOF'
          [
            {
              "date": "${{ inputs.date }}",
              "from": "${{ inputs.from }}",
              "until": "${{ inputs.until }}",
              "duration_minutes": ${{ inputs.duration }},
              "court": "any"
            }
          ]
          EOF

      - name: Check courts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker.py

      - name: Save changes
        run: |
          if [ -f alerts.json ] || [ -f seen_slots.json ] || [ -f slot_state.json ]; then
            git config user.name "Court Watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts.json seen_slots.json slot_state.json
            git diff --cached --quiet || git commit -m "Update Court Watch settings"
            git push
          fi
